<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar and Card Overlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>My Website</h2>
        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section id="home" class="hero">
        <h1>Welcome to My Website</h1>
        <p>Learning CSS positioning</p>
    </section>

    <section class="card-section">
        <div class="card">
            <h2>CSS Card Overlay</h2>
            <p>This card is positioned over the background using CSS.</p>
        </div>
    </section>

    <section id="about">
        <h2>About</h2>
        <p>This page demonstrates sticky navigation and absolute positioning.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Thank you for visiting!</p>
    </section>

</body>
</html>
